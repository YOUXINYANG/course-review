<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">单边指数衰减信号的傅里叶变换</title><desc id="desc">e的负at次方乘以阶跃函数的变换是1除以a加jω，图中画出幅度谱。</desc>
  <style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.axis{stroke:#334155;stroke-width:2}.curve{stroke:#2563eb;stroke-width:4;fill:none}.dash{stroke:#94a3b8;stroke-dasharray:5 5}.label{font-size:22px}.small{font-size:18px;fill:#475569}.formula{font-size:25px;fill:#0f172a;font-family:Georgia,serif}</style>
  <rect width="960" height="360" fill="#fff"/><text x="480" y="42" text-anchor="middle" class="formula">e⁻ᵃᵗu(t)  ↔  1/(a+jω),  a&gt;0</text>
  <g transform="translate(55 82)"><text x="185" y="0" text-anchor="middle" class="label">时域：单边指数衰减</text><line x1="20" y1="180" x2="390" y2="180" class="axis"/><line x1="205" y1="35" x2="205" y2="215" class="axis"/><path d="M28 180H205 C220 92 245 112 270 137 S325 169 378 176" class="curve"/><line x1="205" y1="75" x2="205" y2="180" class="dash"/><text x="213" y="82" class="small">1</text><text x="375" y="204" class="small">t</text><text x="190" y="204" class="small">0</text></g>
  <text x="480" y="195" text-anchor="middle" font-size="34" fill="#64748b">⟶</text>
  <g transform="translate(535 82)"><text x="185" y="0" text-anchor="middle" class="label">频域：|X(jω)|=1/√(a²+ω²)</text><line x1="20" y1="180" x2="390" y2="180" class="axis"/><line x1="205" y1="35" x2="205" y2="215" class="axis"/><path d="M28 175 C65 171 105 160 145 130 C175 108 190 78 205 70 C220 78 235 108 265 130 C305 160 345 171 378 175" class="curve"/><text x="215" y="65" class="small">1/a</text><text x="385" y="204" class="small">ω</text></g>
  <text x="480" y="335" text-anchor="middle" class="small">该图为幅度谱；指数衰减越快（a 越大），频谱越平坦、带宽越宽。</text>
</svg>
