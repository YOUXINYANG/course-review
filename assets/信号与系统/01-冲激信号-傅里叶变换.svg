<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">单位冲激信号的傅里叶变换</title><desc id="desc">左侧为单位冲激，右侧为常数频谱一。</desc>
  <style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.axis{stroke:#334155;stroke-width:2}.curve{stroke:#2563eb;stroke-width:4;fill:none}.grid{stroke:#cbd5e1;stroke-width:1}.label{font-size:22px}.small{font-size:18px;fill:#475569}.formula{font-size:25px;fill:#0f172a;font-family:Georgia,serif}</style>
  <rect width="960" height="360" fill="#fff"/><text x="480" y="42" text-anchor="middle" class="formula">δ(t)  ↔  1</text>
  <g transform="translate(55 82)"><text x="185" y="0" text-anchor="middle" class="label">时域：x(t)=δ(t)</text><line x1="20" y1="180" x2="390" y2="180" class="axis"/><line x1="205" y1="35" x2="205" y2="215" class="axis"/><path d="M205 180V55 M194 70L205 50 216 70" class="curve"/><text x="216" y="64" class="small">1</text><text x="375" y="204" class="small">t</text><text x="190" y="204" class="small">0</text></g>
  <text x="480" y="195" text-anchor="middle" font-size="34" fill="#64748b">⟶</text>
  <g transform="translate(535 82)"><text x="185" y="0" text-anchor="middle" class="label">频域：X(jω)=1</text><line x1="20" y1="180" x2="390" y2="180" class="axis"/><line x1="205" y1="35" x2="205" y2="215" class="axis"/><line x1="32" y1="75" x2="378" y2="75" class="curve"/><text x="385" y="204" class="small">ω</text><text x="215" y="70" class="small">1</text></g>
  <text x="480" y="335" text-anchor="middle" class="small">冲激在时域高度集中，在频域中等量地包含所有角频率分量。</text>
</svg>
