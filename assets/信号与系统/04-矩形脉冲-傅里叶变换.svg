<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">矩形脉冲的傅里叶变换</title><desc id="desc">宽度T振幅A的矩形脉冲变换为AT sinc omegaT除以二。</desc>
  <style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.axis{stroke:#334155;stroke-width:2}.curve{stroke:#2563eb;stroke-width:4;fill:none}.dash{stroke:#94a3b8;stroke-dasharray:5 5}.label{font-size:22px}.small{font-size:18px;fill:#475569}.formula{font-size:25px;fill:#0f172a;font-family:Georgia,serif}</style>
  <rect width="960" height="360" fill="#fff"/><text x="480" y="42" text-anchor="middle" class="formula">A·rect(t/T)  ↔  AT·sinc(ωT/2)</text>
  <g transform="translate(55 82)"><text x="185" y="0" text-anchor="middle" class="label">时域：宽度 T 的矩形脉冲</text><line x1="20" y1="180" x2="390" y2="180" class="axis"/><line x1="205" y1="35" x2="205" y2="215" class="axis"/><path d="M35 180H125V85H285V180H375" class="curve"/><line x1="125" y1="85" x2="125" y2="180" class="dash"/><line x1="285" y1="85" x2="285" y2="180" class="dash"/><text x="210" y="78" class="small">A</text><text x="110" y="204" class="small">−T/2</text><text x="270" y="204" class="small">T/2</text><text x="375" y="204" class="small">t</text></g>
  <text x="480" y="195" text-anchor="middle" font-size="34" fill="#64748b">⟶</text>
  <g transform="translate(535 82)"><text x="185" y="0" text-anchor="middle" class="label">频域：sinc 型连续频谱</text><line x1="20" y1="180" x2="390" y2="180" class="axis"/><line x1="205" y1="35" x2="205" y2="215" class="axis"/><path d="M25 180 C45 180 45 205 65 205 C85 205 85 180 105 180 C125 180 135 225 155 225 C175 225 175 180 185 130 C195 75 215 75 225 130 C235 180 235 225 255 225 C275 225 275 180 295 180 C315 180 315 205 335 205 C355 205 355 180 378 180" class="curve"/><text x="213" y="68" class="small">AT</text><text x="385" y="204" class="small">ω</text></g>
  <text x="480" y="335" text-anchor="middle" class="small">时域越窄（T 越小），主瓣越宽：时间压缩对应频谱展宽。</text>
</svg>
