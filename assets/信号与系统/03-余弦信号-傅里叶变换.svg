<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">余弦信号的傅里叶变换</title><desc id="desc">A余弦omega零t在正负omega零处各有面积派A的冲激。</desc>
  <style>text{font-family:Arial,'Microsoft YaHei',sans-serif;fill:#172033}.axis{stroke:#334155;stroke-width:2}.curve{stroke:#2563eb;stroke-width:4;fill:none}.label{font-size:22px}.small{font-size:18px;fill:#475569}.formula{font-size:25px;fill:#0f172a;font-family:Georgia,serif}</style>
  <rect width="960" height="360" fill="#fff"/><text x="480" y="42" text-anchor="middle" class="formula">A cos(ω₀t)  ↔  πA[δ(ω−ω₀)+δ(ω+ω₀)]</text>
  <g transform="translate(55 82)"><text x="185" y="0" text-anchor="middle" class="label">时域：x(t)=A cos(ω₀t)</text><line x1="20" y1="180" x2="390" y2="180" class="axis"/><line x1="205" y1="35" x2="205" y2="215" class="axis"/><path d="M25 180 C48 105 72 105 95 180 S142 255 165 180 S212 105 235 180 S282 255 305 180 S352 105 378 180" class="curve"/><text x="215" y="70" class="small">A</text><text x="375" y="204" class="small">t</text></g>
  <text x="480" y="195" text-anchor="middle" font-size="34" fill="#64748b">⟶</text>
  <g transform="translate(535 82)"><text x="185" y="0" text-anchor="middle" class="label">频域：两条对称谱线</text><line x1="20" y1="180" x2="390" y2="180" class="axis"/><line x1="205" y1="35" x2="205" y2="215" class="axis"/><path d="M115 180V70 M104 85L115 65 126 85 M295 180V70 M284 85L295 65 306 85" class="curve"/><text x="95" y="204" class="small">−ω₀</text><text x="282" y="204" class="small">ω₀</text><text x="300" y="62" class="small">πA</text><text x="385" y="204" class="small">ω</text></g>
  <text x="480" y="335" text-anchor="middle" class="small">实余弦对应一对共轭对称的离散频率分量，位置为 ±ω₀。</text>
</svg>
